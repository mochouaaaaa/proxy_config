    tag: ali
    type: forward
  - args:
      concurrent: 3
      upstreams:
        - addr: https://doh.pub/dns-query
          dial_addr: 1.12.12.12
        - addr: https://doh.pub/dns-query
          dial_addr: 120.53.53.53
        - addr: tls://dot.pub
          dial_addr: 1.12.12.12
          enable_pipeline: true
        - addr: tls://dot.pub
          dial_addr: 120.53.53.53
          enable_pipeline: true
    tag: dnspod
    type: forward
  - args:
      concurrent: 1
      upstreams:
        - addr: udp://192.168.1.1:53
    tag: local
    type: forward
  - args:
      lazy_cache_ttl: 86400
      size: 8192
    tag: cache_lan
    type: cache
  - args:
      lazy_cache_ttl: 7200
      size: 131072
    tag: cache_wan
    type: cache
  - args:
      forward: false
      mask4: 24
      mask6: 48
      preset: ""
      send: false
    tag: no_ecs
    type: ecs_handler
  - args:
      forward: false
      mask4: 24
      mask6: 48
      preset: 183.2.172.177
      send: false
    tag: ecs_cn
    type: ecs_handler
  - args:
      - exec: ttl 60
    tag: ttl_1m
    type: sequence
  - args:
      - exec: ttl 300
    tag: ttl_5m
    type: sequence
  - args:
      - exec: ttl 3600
    tag: ttl_1h
    type: sequence
  - args:
      always_standby: false
      primary: nextdns
      secondary: quad9
      threshold: 600
    tag: dns_nocn
    type: fallback
  - args:
      always_standby: false
      primary: ali
      secondary: dnspod
      threshold: 600
    tag: dns_cn
    type: fallback
  - args:
      - exec: query_summary dns_nocn
      - exec: $dns_nocn
    tag: dns_nocn_seq
    type: sequence
  - args:
      - exec: query_summary dns_cn
      - exec: $dns_cn
    tag: dns_cn_seq
    type: sequence
  - args:
      - exec: query_summary local
      - exec: $local
    tag: local_seq
    type: sequence
  - args:
      - exec: query_summary fallback
      - exec: $dns_nocn
    tag: fallback_seq
    type: sequence
  - args:
      - exec: query_summary other
      - exec: $dns_cn
    tag: other_seq
    type: sequence
  - args:
      files:
        - /nix/store/aaf8yynh3n6kaf65n8900ri4gj2wzzzf-mosdns-rules/share/mosdns/geoip_private.txt
    tag: geoip_private
    type: ip_set
  - args:
      files:
        - /nix/store/aaf8yynh3n6kaf65n8900ri4gj2wzzzf-mosdns-rules/share/mosdns/geoip_cn.txt
    tag: geoip_cn
    type: ip_set
  - args:
      files:
        - /nix/store/aaf8yynh3n6kaf65n8900ri4gj2wzzzf-mosdns-rules/share/mosdns/geosite_cn.txt
    tag: geosite_cn
    type: domain_set
  - args:
      files:
        - /nix/store/aaf8yynh3n6kaf65n8900ri4gj2wzzzf-mosdns-rules/share/mosdns/geosite_gfw.txt
    tag: geosite_gfw
    type: domain_set
  - args:
      files:
        - /nix/store/aaf8yynh3n6kaf65n8900ri4gj2wzzzf-mosdns-rules/share/mosdns/geosite_geolocation-!cn.txt
    tag: geosite_location-!cn
    type: domain_set
  - args:
      files:
        - /nix/store/aaf8yynh3n6kaf65n8900ri4gj2wzzzf-mosdns-rules/share/mosdns/geosite_category-ads-all.txt
    tag: geosite_ads-all
    type: domain_set
  - args:
      - exec: $ttl_1h
      - exec: accept
    tag: pre_handle
    type: sequence
  - args:
      - exec: $ttl_5m
      - exec: accept
    tag: main_handle
    type: sequence
  - args:
      - exec: goto pre_handle
        matches: has_resp
    tag: has_resp_pre
    type: sequence
  - args:
      - exec: goto main_handle
        matches: has_resp
    tag: has_resp_main
    type: sequence
  - args:
      - exec: $ecs_cn
      - exec: $dns_cn_seq
      - exec: drop_resp
        matches: resp_ip 61.160.148.90/24 221.228.32.13/24 114.237.67.59/24
          117.69.71.58/24 180.109.0.0/16 4.36.66.178 8.7.198.45 37.61.54.158
          46.82.174.68 59.24.3.173 64.33.88.161 78.16.49.15 93.46.8.89
          159.106.121.75 202.106.1.2 202.181.7.85 203.161.230.171 209.145.54.50
          211.94.66.147 216.234.179.13 243.185.187.39
    tag: query_cn
    type: sequence
  - args:
      - exec: $no_ecs
      - exec: $dns_nocn_seq
      - exec: drop_resp
        matches: resp_ip $geoip_cn 61.160.148.90/24 221.228.32.13/24
          114.237.67.59/24 117.69.71.58/24 180.109.0.0/16 4.36.66.178 8.7.198.45
          37.61.54.158 46.82.174.68 59.24.3.173 64.33.88.161 78.16.49.15 93.46.8.89
          159.106.121.75 202.106.1.2 202.181.7.85 203.161.230.171 209.145.54.50
          211.94.66.147 216.234.179.13 243.185.187.39
    tag: query_nocn
    type: sequence
  - args:
      - exec: $no_ecs
      - exec: $fallback_seq
      - exec: drop_resp
        matches: resp_ip $geoip_cn 61.160.148.90/24 221.228.32.13/24
          114.237.67.59/24 117.69.71.58/24 180.109.0.0/16 4.36.66.178 8.7.198.45
          37.61.54.158 46.82.174.68 59.24.3.173 64.33.88.161 78.16.49.15 93.46.8.89
          159.106.121.75 202.106.1.2 202.181.7.85 203.161.230.171 209.145.54.50
          211.94.66.147 216.234.179.13 243.185.187.39
    tag: query_fallback
    type: sequence
  - args:
      - exec: $cache_lan
      - exec: return
        matches: has_resp
      - exec: $local_seq
    tag: query_lan
    type: sequence
  - args:
      - exec: $no_ecs
      - exec: $other_seq
    tag: query_other
    type: sequence
  - args:
      - exec: reject 2
    tag: reject_2
    type: sequence
  - args:
      - exec: reject 3
    tag: reject_3
    type: sequence
  - args:
      - exec: reject 5
    tag: reject_5
    type: sequence
  - args:
      - exec: query_summary reject_null_domain
      - exec: $reject_3
    tag: reject_null_domain
    type: sequence
  - args:
      - exec: query_summary reject_qtype65
      - exec: $reject_3
    tag: reject_qtype65
    type: sequence
  - args:
      - exec: query_summary reject_adlist
      - exec: $reject_3
    tag: reject_ad
    type: sequence
  - args:
      - exec: $reject_qtype65
        matches: qtype 65
      - exec: $reject_null_domain
        matches: "qname keyword::"
      - exec: $reject_ad
        matches: qname $geosite_ads-all
      - exec: $query_lan
        matches: ptr_ip $geoip_private
      - exec: $query_other
        matches: qtype 12
      - exec: $query_other
        matches: qtype 255
      - exec: jump has_resp_pre
    tag: pre_sequence
    type: sequence
  - args:
      - exec: $cache_wan
      - exec: jump has_resp_main
      - exec: $query_nocn
        matches: qname $geosite_gfw
      - exec: jump has_resp_main
      - exec: $query_nocn
        matches: qname $geosite_location-!cn
      - exec: jump has_resp_main
      - exec: $query_cn
        matches: qname $geosite_cn
      - exec: jump has_resp_main
      - exec: $no_ecs
      - exec: $query_fallback
      - exec: jump has_resp_main
    tag: main_sequence
    type: sequence
  - args:
      - exec: metrics_collector metrics
      - exec: $pre_sequence
      - exec: $main_sequence
    tag: sequence
    type: sequence
  - args:
      entry: sequence
      listen: 127.0.0.1:5335
    type: udp_server
  - args:
      entry: sequence
      listen: 127.0.0.1:5335
    type: tcp_server
